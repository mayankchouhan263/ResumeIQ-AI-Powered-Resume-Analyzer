[theme]
primaryColor = "#FFB700"
backgroundColor = "#080D18"
secondaryBackgroundColor = "#111827"
textColor = "#E2E8F0"
font = "sans serif"

[server]
maxUploadSize = 10
enableXsrfProtection = false
enableCORS = false
headless = true

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = true
toolbarMode = "minimal"